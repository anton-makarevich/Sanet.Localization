name: Sanet.Localization Library
permissions:
  contents: read
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'src/Sanet.Localization/**'
      - 'tests/Sanet.Localization.Tests/**'
      - '.github/workflows/ci.yml'
      - 'mise.toml'

  workflow_dispatch:
env:
  NuGetDirectory: ${{ github.workspace }}/nuget

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install mise tools
        uses: jdx/mise-action@v2

      - name: Run tests
        run: mise run test

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/coverage.cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: localization-core
          fail_ci_if_error: true

      - name: Generate diff coverage report
        id: report
        if: github.event_name == 'pull_request'
        uses: anton-makarevich/Cocodif@v0.2.3
        with:
          coverage-files: ./coverage/coverage.cobertura.xml
          title: Localization Coverage
          include: 'src/Sanet.Localization/**'
          exclude: '**/obj/**,**/bin/**'
          comment: 'false'
          summary: 'false'

      - name: Stage coverage comment artifact
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cocodif-localization"
          cp "${{ steps.report.outputs.report-path }}" "$RUNNER_TEMP/cocodif-localization/report.md"
          echo "${{ github.event.pull_request.number }}" > "$RUNNER_TEMP/cocodif-localization/pr_number"

      - name: Upload coverage comment artifact
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: cocodif-localization
          path: ${{ runner.temp }}/cocodif-localization
          if-no-files-found: ignore

  publish-nuget:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install mise tools
        uses: jdx/mise-action@v2

      - name: Determine version suffix
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "VERSION_SUFFIX=" >> $GITHUB_ENV
          else
            echo "VERSION_SUFFIX=preview" >> $GITHUB_ENV
          fi

      - name: Create nuget packages
        run: mise run pack

      - name: Publish NuGet package
        run: |
          for file in "${{ env.NuGetDirectory }}"/*.nupkg; do
            dotnet nuget push "$file" --api-key "${{ secrets.NUGET_APIKEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done
