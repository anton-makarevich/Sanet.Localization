[tools]
"gh" = "2.96.0"
"uv" = "0.12.0"

[tasks.build]
description = "Builds the solution"
run = "dotnet build Sanet.Localization.slnx"

[tasks.test]
description = "Runs all tests with coverage and generates a cobertura report"
run = """
rm -rf coverage && mkdir -p coverage
dotnet test --project tests/Sanet.Localization.Tests/Sanet.Localization.Tests.csproj \
  --coverage \
  --coverage-output-format cobertura \
  --coverage-output "$PWD/coverage/coverage.cobertura.xml"
"""

[tasks.pack]
description = "Packs the NuGet package (set VERSION_SUFFIX env for preview builds)"
run = "dotnet pack src/Sanet.Localization.Core/Sanet.Localization.Core.csproj --configuration Release --output nuget -p:VersionSuffix=$VERSION_SUFFIX"

[tasks.install-skills]
description = "Installs all skills (local + third-party) to .agents/skills via the skills.sh CLI"
run = [
  "npx -y skills add https://github.com/anton-makarevich/MakaMek/skills --dir .agents/skills -y",
  "npx -y skills add https://github.com/vercel-labs/skills --skill find-skills --dir .agents/skills -y",
  "npx -y skills add https://github.com/mattpocock/skills --skill tdd --skill triage --skill handoff --dir .agents/skills -y",
]

[tasks.install-serena]
description = "Installs the Serena MCP server via uv tool install"
run = """
uv tool install -p 3.13 serena-agent
serena --version
"""

[tasks.update-serena]
description = "Updates the Serena MCP server to the latest version"
run = "uv tool upgrade serena-agent"
